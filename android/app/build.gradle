plugins {
    id 'com.android.application'
}

// Ключ подписи не хранится в репозитории: сборка на GitHub берёт его из секретов.
def keystoreFile = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'ru.avtoves.driver'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.avtoves.driver'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName '2.2'
    }

    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'avtoves'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}

// Уведомления через Google включаются, когда рядом лежит google-services.json из проекта Firebase.
// Файл в репозитории не хранится: сборка на GitHub берёт его из секрета GOOGLE_SERVICES_JSON.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
