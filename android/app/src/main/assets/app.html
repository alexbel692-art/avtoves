<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>АвтоВес Водитель</title>
<style>
:root {
  --steel: #dfe5ea; --paper: #ffffff; --ink: #101b25; --muted: #4f5e6b;
  --line: #aeb9c3; --red: #0b5cad; --red-dark: #084a8c; --ok: #14663c; --warn: #8a4b00;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--steel); color: var(--ink); }
body { font: 17px/1.35 Roboto, "Noto Sans", system-ui, sans-serif; min-height: 100vh; }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
h1, h2 { margin: 0; line-height: 1.15; }
h1 { font-size: 24px; }
h2 { font-size: 19px; margin: 26px 0 8px; }
p { margin: 8px 0; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.bar b { font-size: 18px; }
button, select, input {
  font: inherit; color: inherit; width: 100%; min-height: 54px; border-radius: 6px;
}
input, select { background: var(--paper); border: 2px solid var(--line); padding: 10px 12px; }
input:focus, select:focus, button:focus-visible { outline: 3px solid #1b66b3; outline-offset: 1px; }
label { display: block; font-weight: 600; margin: 14px 0 5px; }
button { border: 2px solid var(--ink); background: var(--paper); font-weight: 700; padding: 8px 14px; }
button.main { background: var(--red); border-color: var(--red-dark); color: #fff; font-size: 20px; min-height: 66px; }
button.main:active { background: var(--red-dark); }
button.small { width: auto; min-height: 44px; font-size: 15px; padding: 4px 12px; }
button.quiet { border-color: var(--line); font-weight: 600; }
.plate {
  display: inline-flex; align-items: stretch; background: #fff; color: #000;
  border: 3px solid #000; border-radius: 7px; font-weight: 800; font-size: 26px;
  letter-spacing: .04em; line-height: 1; overflow: hidden;
}
.plate span { padding: 9px 12px 8px; }
.plate i {
  font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: 0;
  border-left: 3px solid #000; padding: 6px 7px; display: flex; align-items: center;
}
.plates { display: flex; flex-wrap: wrap; gap: 8px; }
.plates .plate { font-size: 19px; border-width: 2px; }
.plates .plate span { padding: 6px 8px; }
.weight { font-size: 54px; line-height: 1.05; font-weight: 800; font-variant-numeric: tabular-nums; margin: 6px 0; }
.photo { width: 100%; border-radius: 6px; margin-top: 10px; display: block; }
.info { background: #fff; border-left: 6px solid var(--red); padding: 10px 12px; border-radius: 0 6px 6px 0; margin: 12px 0; }
.info b { font-size: 22px; font-variant-numeric: tabular-nums; }
.error-text { color: #b3261e; }
.none { color: #b3261e !important; }
.order { border-left-color: var(--red); }
.order .addr { font-size: 17px; margin: 4px 0; }
.order .twin { margin-top: 8px; }
button.on-choice { background: var(--ink); color: #fff; border-color: var(--ink); }
.hitch { background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
.hitch .cap { font-size: 18px; margin: 10px 0 12px; }
.none { color: var(--red-dark); font-weight: 700; font-size: 20px; margin-bottom: 12px; }
.sum { display: flex; align-items: baseline; gap: 8px; margin: 2px 0 6px; flex-wrap: wrap; }
.sum strong { font-size: 44px; line-height: 1.05; font-weight: 800; font-variant-numeric: tabular-nums; }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.row b { white-space: nowrap; font-variant-numeric: tabular-nums; }
.trip { background: var(--paper); border-left: 6px solid var(--ink); padding: 11px 12px; margin-bottom: 8px; border-radius: 0 6px 6px 0; }
.trip.pending { border-left-color: var(--warn); }
.trip .top { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; }
.trip .top b { white-space: nowrap; font-variant-numeric: tabular-nums; }
.trip .meta { color: var(--muted); font-size: 15px; margin-top: 3px; }
.trip .act { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px; }
.state { font-size: 15px; font-weight: 600; color: var(--ok); margin-bottom: 12px; }
.state.wait { color: var(--warn); }
.notice { background: #fff; border: 2px solid var(--red); padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; }
.error { color: var(--red-dark); font-weight: 600; margin-top: 10px; min-height: 1.2em; }
.pick { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--paper); text-align: left; margin-bottom: 8px; min-height: 72px; border: 2px solid var(--line); }
.pick.on { border-color: var(--red); border-width: 3px; }
.pick .plate { font-size: 19px; border-width: 2px; }
.pick .plate span { padding: 6px 8px; }
.twin { display: flex; gap: 10px; }
.twin > * { flex: 1; }
.back { margin-bottom: 14px; }
.dialog { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
.dialog > div { background: #fff; border-radius: 10px; padding: 18px; max-width: 528px; width: 100%; }
.dialog .twin { margin-top: 14px; }
.toast { position: fixed; left: 16px; right: 16px; bottom: 18px; background: var(--ink); color: #fff; padding: 14px; border-radius: 8px; text-align: center; font-weight: 600; }
.empty { color: var(--muted); padding: 10px 0; }
</style>
</head>
<body>
<main id="view"></main>
<div id="overlay"></div>
<script src="app.js"></script>
</body>
</html>
