<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АвтоВес — вход</title>
<link rel="icon" href="/static/favicon.ico">
<style>
  :root { --bg:#121417; --panel:#1b1f24; --line:#2e343d; --text:#e6e8eb; --muted:#8a929e; --accent:#f2a900; --bad:#e5484d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 "Segoe UI", system-ui, sans-serif; }
  body { display: grid; place-items: center; padding: 16px; }
  form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
  h1 { margin: 0 0 4px; color: var(--accent); font-size: 26px; }
  .muted { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  input, button { font: inherit; width: 100%; border-radius: 8px; padding: 12px 14px; }
  input { background: var(--bg); color: var(--text); border: 1px solid var(--line); font-size: 17px; }
  button { margin-top: 14px; border: 0; background: var(--accent); color: #111; font-weight: 600; cursor: pointer; }
  .err { color: var(--bad); min-height: 20px; margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
<form id="f">
  <h1>АвтоВес</h1>
  <div class="muted">Рабочее место оператора весовой</div>
  <input id="pw" type="password" placeholder="Пароль оператора" autocomplete="current-password" autofocus>
  <button>Войти</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  const r = await fetch("/api/op/login", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: document.getElementById("pw").value }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { err.textContent = j.error || "ошибка"; return; }
  location.href = "/";
};
</script>
</body>
</html>
