<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АвтоВес: логист</title>
<link rel="stylesheet" href="/static/leaflet/leaflet.css">
<style>
:root { --bg:#eef1f5; --paper:#fff; --ink:#15202b; --muted:#566573; --line:#d5dbe2; --accent:#1d5fbf; --accent-d:#164a96; --bad:#b3261e; --ok:#14663c; --side:#15202b; --side-ink:#c9d3dd; --series:#2a78d6; --grid:#e3e8ee; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 "Segoe UI",Roboto,"Noto Sans",system-ui,sans-serif; }
#view.app { display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh; }
aside { background:var(--side); color:var(--side-ink); padding:18px 12px; display:flex; flex-direction:column; gap:14px; position:sticky; top:0; height:100vh; overflow-y:auto; }
aside .brand { color:#fff; font-size:19px; font-weight:800; padding:0 8px; }
aside .brand small { display:block; color:var(--side-ink); font-size:12px; font-weight:400; }
aside nav { display:flex; flex-direction:column; gap:2px; }
aside nav button, aside .who button { background:none; border:0; color:var(--side-ink); text-align:left; font-weight:500; padding:8px 10px; border-radius:7px; min-height:38px; }
aside nav button:hover, aside .who button:hover { background:#22303f; color:#fff; }
aside nav button[aria-current="page"] { background:var(--accent); color:#fff; font-weight:700; }
aside .group { font-size:12px; color:#8697a8; padding:10px 10px 2px; }
aside .who { margin-top:auto; border-top:1px solid #2b3a4a; padding-top:10px; font-size:13px; }
aside .who div { padding:0 10px 4px; }
main.page { padding:22px 26px 50px; min-width:0; }
main.page > h1 { font-size:24px; margin:0 0 16px; }
h1 { font-size:21px; margin:0; }
h2 { font-size:16px; margin:0 0 10px; }
button,input,select { font:inherit; color:inherit; min-height:38px; border-radius:7px; }
button { background:#fff; border:1px solid #b8c2cc; padding:4px 13px; cursor:pointer; font-weight:600; }
button:hover { border-color:var(--ink); }
button.primary { background:var(--accent); border-color:var(--accent-d); color:#fff; }
button.primary:hover { background:var(--accent-d); }
.seg { display:inline-flex; gap:4px; }
.seg button[aria-current="page"] { background:var(--ink); color:#fff; border-color:var(--ink); }
input,select { background:#fff; border:1px solid #b8c2cc; padding:4px 9px; max-width:100%; }
:focus-visible { outline:3px solid #f0a000; outline-offset:1px; }
label { display:flex; flex-direction:column; gap:3px; font-size:13px; font-weight:600; }
.controls { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-bottom:14px; }
.figures { font-size:18px; margin:0 0 14px; }
.figures b { font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; }
.columns { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; margin-bottom:18px; }
.scroll { overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--paper); }
table { width:100%; border-collapse:collapse; background:var(--paper); }
th,td { text-align:left; padding:9px 11px; border-bottom:1px solid var(--line); vertical-align:middle; }
tbody tr:last-child td { border-bottom:0; }
tbody tr:hover td { background:#f6f8fa; }
th { font-size:12.5px; color:var(--muted); background:#f6f8fa; font-weight:600; }
td.num,th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
tr.off td { color:var(--muted); }
.bad { color:var(--bad); font-weight:700; }
.good { color:var(--ok); font-weight:600; }
.actions { display:flex; gap:6px; flex-wrap:wrap; }
.actions button { min-height:32px; padding:2px 10px; font-weight:500; }
.error { color:var(--bad); font-weight:600; min-height:1.3em; margin:8px 0; }
.login { max-width:380px; margin:10vh auto; background:#fff; padding:26px; border-radius:14px; box-shadow:0 10px 40px rgba(21,32,43,.14); display:flex; flex-direction:column; gap:11px; }
dialog { border:0; border-radius:14px; padding:22px; width:min(480px,calc(100vw - 32px)); box-shadow:0 20px 60px rgba(21,32,43,.3); }
dialog.wide { width:min(760px,calc(100vw - 32px)); }
dialog::backdrop { background:rgba(21,32,43,.45); }
dialog form { display:flex; flex-direction:column; gap:10px; }
dialog h2 { margin:0; font-size:18px; }
.row-end { display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
.empty { color:var(--muted); padding:10px 0; }
section { margin-bottom:22px; }
.note { margin:0 0 10px; color:var(--muted); }
small { color:var(--muted); }
.card { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
.tile { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:13px 16px; text-align:left; font-weight:400; min-height:0; }
button.tile:hover { border-color:var(--accent); }
.tile .k { font-size:13px; color:var(--muted); }
.tile .v { white-space:nowrap; font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.2; }
.tile .s { font-size:13px; color:var(--muted); }
.tile.alert .v { color:var(--bad); }
.dash { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
.dash .wide { grid-column:1 / -1; }
.chart { position:relative; }
.chart svg { width:100%; height:auto; display:block; }
.chart .bar { fill:var(--series); }
.chart .hit { fill:transparent; cursor:default; }
.chart .bar:has(+ .hit:hover), .chart .bar:has(+ .hit:focus) { fill:#184f95; }
.chart .hit:focus-visible { outline:2px solid #f0a000; outline-offset:-2px; }
.chart text { font-size:11px; fill:var(--muted); }
.chart text.val { fill:var(--ink); font-weight:700; }
.chart line { stroke:var(--grid); }
.hbars { display:grid; grid-template-columns:minmax(90px,38%) 1fr; gap:7px 10px; align-items:center; }
.hbars .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
.hbars .track { display:flex; align-items:center; gap:8px; min-width:0; }
.hbars .fill { height:14px; background:var(--series); border-radius:0 4px 4px 0; min-width:2px; }
.hbars .track:hover .fill { background:#184f95; }
.hbars .val { font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.tip { position:fixed; z-index:50; background:var(--ink); color:#fff; padding:6px 9px; border-radius:7px; font-size:13px; pointer-events:none; white-space:nowrap; }
details.tableview { margin-top:8px; font-size:13px; }
details.tableview summary { cursor:pointer; color:var(--muted); }
.pick-list { max-height:50vh; overflow:auto; border:1px solid var(--line); border-radius:8px; }
.pick-list td { padding:5px 8px; }
.pick-list input[type=text] { min-height:32px; width:120px; }
.pick-list select { min-height:32px; }
.pick-list input[type=checkbox] { min-height:0; width:18px; height:18px; }
.map-wrap { display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:14px; }
#map { height:calc(100vh - 170px); min-height:420px; background:#c9d2da; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.fleet { display:flex; flex-direction:column; gap:8px; max-height:calc(100vh - 170px); overflow-y:auto; }
.fleet button { text-align:left; font-weight:400; padding:9px 11px; border-color:var(--line); }
.fleet b { display:block; }
.fleet .old { border-left:5px solid var(--muted); }
.fleet .live { border-left:5px solid var(--accent); }
.car-mark { width:auto !important; height:auto !important; background:none; border:0; }
.car-mark span { display:inline-block; transform:translate(-50%,-50%); white-space:nowrap; background:#fff; color:#000; border:2px solid var(--accent); border-radius:4px; padding:1px 5px; font-weight:800; font-size:13px; }
.car-mark.old span { border-color:var(--muted); color:var(--muted); }
.car p { margin:3px 0; }
@media (max-width:860px) {
  #view.app { grid-template-columns:1fr; }
  aside { position:static; height:auto; padding:10px; }
  aside nav { flex-direction:row; flex-wrap:wrap; }
  aside .group { display:none; }
  aside .who { margin-top:0; border-top:0; display:flex; align-items:center; gap:8px; padding-top:0; }
  main.page { padding:14px 12px 40px; }
  .dash { grid-template-columns:minmax(0,1fr); }
  .map-wrap { grid-template-columns:1fr; } #map { height:60vh; } .fleet { max-height:none; }
}
</style>
</head>
<body>
<div id="view"></div>
<dialog id="dlg"></dialog>
<script src="/static/leaflet/leaflet.js"></script>
<script>
'use strict';
const view = document.getElementById('view');
const dlg = document.getElementById('dlg');
let token = null;
try { token = localStorage.getItem('av.logist'); } catch (e) {}
let tab = 'home';
let me = null;
let refs = null;
let invoiceView = 'pending';
const pad = (n) => String(n).padStart(2, '0');
const today = (() => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; })();
const filter = { from: today, to: today, driver_id: '', client_id: '', plate: '' };
const legFilter = { from: (() => { const d = new Date(Date.now() - 6 * 864e5); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; })(), to: today };

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c !== null && c !== undefined && c !== false) node.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return node;
}
const fmt = (v) => (v === null || v === undefined ? '' : Number(v).toLocaleString('ru-RU', { maximumFractionDigits: 2 }));
const when = (s) => (s ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) + ' ' + s.slice(11, 16) : '');

async function api(path, method, body) {
  const resp = await fetch(path, {
    method: method || 'GET',
    headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}),
    body: body ? JSON.stringify(body) : undefined,
  });
  if (resp.status === 401 && token && !path.endsWith('/login')) {
    setToken(null); render();
    throw new Error('Войдите заново');
  }
  const type = resp.headers.get('Content-Type') || '';
  const payload = type.includes('json') ? await resp.json() : resp;
  if (!resp.ok) throw new Error(payload.error || 'Ошибка сервера ' + resp.status);
  return payload;
}
function setToken(value) {
  token = value;
  try { value ? localStorage.setItem('av.logist', value) : localStorage.removeItem('av.logist'); } catch (e) {}
}

function form(title, fields, submitText, onSubmit) {
  dlg.className = '';
  const error = el('div', { class: 'error', role: 'alert' });
  const inputs = {};
  const body = fields.map((f) => {
    let input;
    if (f.options) {
      input = el('select', { name: f.name }, f.options.map((o) => el('option', { value: o.value, selected: String(o.value) === String(f.value ?? '') }, o.label)));
    } else {
      input = el('input', { name: f.name, type: f.type || 'text', value: f.value ?? '', inputmode: f.inputmode, autocomplete: f.type === 'password' ? 'new-password' : 'off', maxlength: f.maxlength });
    }
    inputs[f.name] = input;
    return el('label', null, f.label, input);
  });
  dlg.replaceChildren(el('form', {
    onsubmit: async (event) => {
      event.preventDefault();
      const values = {};
      for (const [k, input] of Object.entries(inputs)) values[k] = input.value;
      try { await onSubmit(values); dlg.close(); render(); }
      catch (err) { error.textContent = err.message; }
    },
  }, el('h2', null, title), body, error,
  el('div', { class: 'row-end' },
    el('button', { type: 'button', onclick: () => dlg.close() }, 'Отмена'),
    el('button', { type: 'submit', class: 'primary' }, submitText))));
  dlg.showModal();
}
function confirmBox(text, yes, action) {
  const error = el('div', { class: 'error', role: 'alert' });
  dlg.replaceChildren(el('form', {
    onsubmit: async (e) => {
      e.preventDefault();
      try { await action(); dlg.close(); render(); } catch (err) { error.textContent = err.message; }
    },
  }, el('p', null, text), error, el('div', { class: 'row-end' },
    el('button', { type: 'button', onclick: () => dlg.close() }, 'Отмена'),
    el('button', { type: 'submit', class: 'primary' }, yes))));
  dlg.showModal();
}
const act = (path) => async () => {
  try { await api(path, 'POST'); render(); } catch (err) { confirmBox(err.message, 'Понятно', async () => {}); }
};

let renderCount = 0;
async function render() {
  const run = ++renderCount;
  stopMap();
  if (!token) { await renderLogin(); return; }
  try {
    me = await api('/api/logist/me');
    refs = await api('/api/logist/refs');
    const manager = me.role === 'manager';
    const badge = 'Уведомления' + (me.notices ? ` (${me.notices})` : '');
    const groups = manager
      ? [['', [['home', 'Сводка'], ['notices', badge], ['report', 'Выгрузки']]], ['Настройки', [['logists', 'Мой пароль']]]]
      : [['', [['home', 'Сводка'], ['notices', badge], ['map', 'Карта'], ['orders', 'Заказы']]],
        ['Учёт', [['report', 'Выгрузки'], ['legs', 'Сверка с весами'], ['weighings', 'Взвешивания']]],
        ['Справочники', [['clients', 'Клиенты'], ['drivers', 'Водители'], ['logists', 'Логисты и менеджеры']]]]
        .concat(me.admin ? [['Подключения', [['stavtrack', 'Ставтрэк'], ['routing', 'Маршруты']]]] : []);
    const tabs = groups.flatMap(([, items]) => items);
    if (!tabs.some(([id]) => id === tab)) tab = 'home';
    const title = tabs.find(([id]) => id === tab)[1].replace(/ \(\d+\)$/, '');
    const head = el('aside', null,
      el('div', { class: 'brand' }, 'АвтоВес', el('small', null, manager ? 'Кабинет менеджера' : 'Кабинет логиста')),
      el('nav', { 'aria-label': 'Разделы' }, groups.map(([name, items]) => [name ? el('div', { class: 'group' }, name) : null,
        items.map(([id, label]) => el('button', { 'data-tab': id, 'aria-current': tab === id ? 'page' : null, onclick: () => { tab = id; render(); } }, label))])),
      el('div', { class: 'who' }, el('div', null, me.name || me.login), el('button', { id: 'logout', onclick: () => { setToken(null); render(); } }, 'Выйти (' + me.login + ')')));
    const body = await ({ home: renderHome, notices: renderNotices, map: renderMap, orders: renderOrders, report: renderReport, legs: renderLegs, weighings: renderWeighings, clients: renderClients, drivers: renderDrivers, logists: renderLogists, stavtrack: renderStavtrack, routing: renderRouting })[tab]();
    if (run !== renderCount) return;
    view.className = 'app';
    view.replaceChildren(head, el('main', { class: 'page' }, el('h1', null, title), body));
    if (tab === 'map') startMap();
  } catch (err) {
    if (!token || run !== renderCount) return;
    view.className = '';
    view.replaceChildren(el('div', { class: 'login' }, el('div', { class: 'error', role: 'alert' }, err.message), el('button', { onclick: render }, 'Повторить')));
  }
}

async function renderLogin() {
  let status = { setup: false, empty: false };
  try { status = await api('/api/logist/status'); } catch (e) {}
  const error = el('div', { class: 'error', role: 'alert' });
  const login = el('input', { id: 'l-login', autocomplete: 'username', autocapitalize: 'off' });
  view.className = '';
  const password = el('input', { id: 'l-pass', type: 'password', autocomplete: status.setup ? 'new-password' : 'current-password' });
  const name = el('input', { id: 'l-name' });
  view.replaceChildren(el('form', {
    class: 'login',
    onsubmit: async (e) => {
      e.preventDefault();
      try {
        const res = status.setup
          ? await api('/api/logist/setup', 'POST', { login: login.value, password: password.value, name: name.value })
          : await api('/api/logist/login', 'POST', { login: login.value, password: password.value });
        setToken(res.token); render();
      } catch (err) { error.textContent = err.message; }
    },
  }, el('h1', null, status.setup ? 'Первый логист' : 'Кабинет логиста и менеджера'),
  status.setup ? el('p', { class: 'note' }, 'Логистов пока нет. Создайте первого: он сможет добавлять остальных.') : null,
  status.empty && !status.setup ? el('p', { class: 'note' }, 'Логистов пока нет. Первого создают в программе АвтоВес на весовой, вкладка «Уведомления».') : null,
  status.setup ? el('label', null, 'Имя', name) : null,
  el('label', null, 'Логин', login), el('label', null, status.setup ? 'Пароль, от 8 символов' : 'Пароль', password),
  el('button', { class: 'primary', type: 'submit', id: 'l-enter' }, status.setup ? 'Создать логиста' : 'Войти'), error));
}

// ----- сводка -----
const SVG = 'http://www.w3.org/2000/svg';
function svg(tag, attrs, ...children) {
  const node = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v);
  }
  for (const c of children.flat(Infinity)) if (c !== null && c !== undefined && c !== false) node.append(c.nodeType ? c : document.createTextNode(String(c)));
  return node;
}
let tipNode = null;
function tip(target, text) {
  const show = (e) => {
    hideTip();
    tipNode = el('div', { class: 'tip', role: 'tooltip' }, text);
    document.body.append(tipNode);
    const r = target.getBoundingClientRect();
    const x = e && e.clientX ? e.clientX : r.left + r.width / 2;
    tipNode.style.left = Math.max(6, Math.min(window.innerWidth - tipNode.offsetWidth - 6, x - tipNode.offsetWidth / 2)) + 'px';
    tipNode.style.top = Math.max(6, r.top - tipNode.offsetHeight - 8) + 'px';
  };
  target.addEventListener('mouseenter', show);
  target.addEventListener('mousemove', show);
  target.addEventListener('focus', () => show());
  target.addEventListener('mouseleave', hideTip);
  target.addEventListener('blur', hideTip);
}
function hideTip() { if (tipNode) { tipNode.remove(); tipNode = null; } }
const dm = (d) => d.slice(8, 10) + '.' + d.slice(5, 7);
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  return [1, 2, 3, 4, 5, 8, 10].map((m) => m * p).find((m) => m >= v);
}
function dayChart(days) {
  const W = 760, H = 250, L = 52, R = 10, T = 18, B = 26;
  const max = niceMax(Math.max(...days.map((d) => d.liters)));
  const slot = (W - L - R) / days.length;
  const bw = Math.min(24, slot - 6);
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const best = days.reduce((a, b) => (b.liters > a.liters ? b : a), days[0]);
  const parts = [];
  for (const g of [0, 0.25, 0.5, 0.75, 1]) {
    parts.push(svg('line', { x1: L, x2: W - R, y1: y(max * g), y2: y(max * g) }),
      svg('text', { x: L - 8, y: y(max * g) + 4, 'text-anchor': 'end' }, fmt(max * g)));
  }
  days.forEach((d, i) => {
    const x = L + slot * i + (slot - bw) / 2;
    const top = y(d.liters), h = H - B - top;
    const hit = svg('rect', { class: 'hit', x: L + slot * i, y: T, width: slot, height: H - T - B, tabindex: 0, 'aria-label': `${dm(d.day)}: ${fmt(d.liters)} л, выгрузок ${d.count}` });
    tip(hit, `${dm(d.day)}: ${fmt(d.liters)} л, выгрузок: ${d.count}`);
    // столбик со скруглённым верхом и прямым основанием
    const r = Math.min(4, h, bw / 2);
    const bar = svg('path', { class: 'bar', d: h <= 0 ? '' : `M${x},${H - B} V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - r} Q${x + bw},${top} ${x + bw},${top + r} V${H - B} Z` });
    parts.push(bar, hit);      // прозрачная область поверх столбика: подсказка появляется по всей высоте
    if (d.liters > 0 && (d === best || i === days.length - 1)) parts.push(svg('text', { class: 'val', x: x + bw / 2, y: top - 5, 'text-anchor': 'middle' }, fmt(Math.round(d.liters))));
    if (i % 2 === (days.length - 1) % 2) parts.push(svg('text', { x: x + bw / 2, y: H - 8, 'text-anchor': 'middle' }, dm(d.day)));
  });
  return el('div', { class: 'chart', id: 'chart-days' },
    svg('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Слито литров по дням за 14 дней' }, parts),
    el('details', { class: 'tableview' }, el('summary', null, 'Показать таблицей'),
      el('table', null, el('thead', null, el('tr', null, el('th', null, 'День'), el('th', { class: 'num' }, 'Литры'), el('th', { class: 'num' }, 'Выгрузок'))),
        el('tbody', null, days.map((d) => el('tr', null, el('td', null, dm(d.day)), el('td', { class: 'num' }, fmt(d.liters)), el('td', { class: 'num' }, d.count)))))));
}
function hbars(rows, id) {
  if (!rows.length) return el('p', { class: 'empty' }, 'За 14 дней выгрузок нет.');
