name: АвтоВес — установщик Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (например 1.0.0)'
        required: true
        default: '1.0.0'
      publish:
        description: 'Опубликовать в релизах'
        type: boolean
        default: true

permissions:
  contents: read

env:
  V: ${{ inputs.version }}
  PYTHONUTF8: '1'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # только для выкладки диагностики при сбое (релиз ci-debug)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Сборка установщика
        shell: pwsh
        run: |
          if ($env:V -notmatch '^\d+\.\d+\.\d+$') { Write-Output "::error::Версия должна быть вида 1.2.3"; exit 1 }
          .\build\build.ps1 -Version $env:V

      # Как на весовой: порт 8780 уже занят другой программой («детектор людей») →
      # тихая установка → служба на свободном порту → проезд машины пишется → программа АвтоВес.exe открывается →
      # обновление поверх (порт в настройках занят) — АвтоВес сам переезжает, база цела → удаление →
      # установка «только программа оператора».
      - name: Проверка установки
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = "Stop"
          # ждём только сам установщик (Start-Process -Wait ждёт и все порождённые процессы)
          function Shot($name) {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path (Resolve-Path ci-logs) "$name.png"))
          }
          function LogTail($file, $stage) {
            if (Test-Path $file) {
              Get-Content $file -Encoding UTF8 -Tail 25 | ForEach-Object { Write-Output "::warning title=$stage (журнал)::$_" }
            }
          }
          function Setup($argv, $stage) {
            $t0 = Get-Date
            $log = ($argv | Where-Object { $_ -like '/LOG=*' }) -replace '^/LOG=', ''
            $p = Start-Process $setup -ArgumentList $argv -PassThru
            if (-not $p.WaitForExit(600000)) {
              Write-Output "::error title=$stage::установщик не завершился за 10 минут"
              Get-Process | Where-Object { $_.StartTime -gt $t0 } | ForEach-Object { Write-Output "::warning title=Процессы::$($_.Name) $($_.Path)" }
              LogTail $log $stage
              Shot "hang"
              Stop-Process -Id $p.Id -Force; exit 1
            }
            Write-Output "::notice title=$stage::установщик завершился за $([int]((Get-Date)-$t0).TotalSeconds) с, код $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { Write-Output "::error title=$stage::код установщика $($p.ExitCode)"; LogTail $log $stage; exit 1 }
            Get-Content $log -Encoding UTF8 | Select-String 'WebView2|AvtoVesService|setup_config|netsh' | Select-Object -Last 12 | ForEach-Object { Write-Output "::notice title=$stage (журнал)::$($_.Line)" }
          }
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          $setup = "dist\AvtoVes-Setup-$env:V.exe"
          $busy = Start-Process python -ArgumentList '-m','http.server','8780' -PassThru -WindowStyle Hidden
          Start-Sleep 3
          function Port { (Get-ItemProperty HKLM:\Software\AvtoVes).Port }
          function Api($path) { Invoke-RestMethod "http://127.0.0.1:$(Port)$path" }
          function WaitApi($path) { for ($i=0; $i -lt 60; $i++) { try { return (Api $path) } catch { Start-Sleep 1 } }; return $null }

          Setup @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=simulate','/LOG=ci-logs\install.log') 'Установка'

          $svc = Get-Service AvtoVes
          Write-Output "служба: $($svc.Status), запуск: $($svc.StartType), порт: $(Port)"
          if ($svc.Status -ne 'Running') { Get-Content ci-logs\install.log -Tail 40; exit 1 }
          if ((Port) -eq '8780') { Write-Output "::error::АвтоВес встал на занятый порт 8780"; exit 1 }
          $s = WaitApi "/api/state"
          if (-not $s) { Get-ChildItem C:\ProgramData\AvtoVes\logs | Get-Content -Tail 40; exit 1 }
          Write-Output "АвтоВес $($s.version), весы на связи: $($s.scale.connected)"
          if ($s.version -ne $env:V) { Write-Output "::error::версия $($s.version) вместо $env:V"; exit 1 }
          $body = [Text.Encoding]::UTF8.GetBytes('{"plate":"А777МР50","weight":38460,"side":"a"}')
          Invoke-RestMethod -Method Post "http://127.0.0.1:$(Port)/api/sim/drive" -ContentType 'application/json; charset=utf-8' -Body $body | Out-Null
          $t = @()
          for ($i=0; $i -lt 60; $i++) { Start-Sleep 1; $r = Api "/api/trips"; $t = @($r); if ($t.Count) { break } }
          if (-not $t.Count) { Write-Output "::error::взвешивание не записалось"; exit 1 }
          Write-Output "рейс: $($t[0].plate) $($t[0].w1) кг"

          Write-Output "--- программа АвтоВес.exe"
          $exe = "C:\Program Files\AvtoVes\AvtoVes.exe"
          if (-not (Test-Path $exe)) { Write-Output "::error::нет АвтоВес.exe"; exit 1 }
          $p = Start-Process $exe -PassThru
          Start-Sleep 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save((Join-Path (Resolve-Path ci-logs) "client.png"))
          if ($p.HasExited) { Write-Output "::error::АвтоВес.exe закрылась (код $($p.ExitCode))"; exit 1 }
          Write-Output "::notice title=Программа::окно '$((Get-Process -Id $p.Id).MainWindowTitle)' открыто"
          Stop-Process -Id $p.Id -Force

          Write-Output "--- обновление поверх, порт в настройках занят"
          Stop-Service AvtoVes
          $cfg = "C:\ProgramData\AvtoVes\config.yaml"
          $txt = Get-Content $cfg -Raw -Encoding UTF8
          # первый «  port:» — раздел server (порт веб-интерфейса); ставим занятый 8780
          [regex]::new('(?m)^(  port: )\d+').Replace($txt, '${1}8780', 1) | Set-Content $cfg -Encoding UTF8 -NoNewline
          Setup @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=ci-logs\update.log') 'Обновление'

          if ((Get-Service AvtoVes).Status -ne 'Running') { Get-Content ci-logs\update.log -Tail 40; exit 1 }
          Write-Output "::notice title=Порт::после обновления $(Port) (был занят 8780)"
          if ((Port) -eq '8780') { Write-Output "::error::после обновления остался занятый порт"; exit 1 }
          $r2 = WaitApi "/api/trips"; $t2 = @($r2)
          if ($t2.Count -lt 1) { Write-Output "::error::после обновления пропала база"; exit 1 }
          Write-Output "после обновления рейсов: $($t2.Count)"
          $io = (Get-Content $cfg -Encoding UTF8 | Select-String '^\s+port:\s*(\d+)' -AllMatches | ForEach-Object { $_.Matches[0].Groups[1].Value }) -join ','
          Write-Output "порты в настройках: $io"
          Copy-Item $cfg ci-logs\config.yaml

          Write-Output "--- удаление"
          $u = Start-Process "C:\Program Files\AvtoVes\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $u.WaitForExit(300000)) { Write-Output "::error title=Удаление::не завершилось за 5 минут"; exit 1 }
          Start-Sleep 5
          if (Get-Service AvtoVes -ErrorAction SilentlyContinue) { Write-Output "::error::служба осталась после удаления"; exit 1 }

          Write-Output "--- только программа оператора"
          Setup @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TYPE=client','/SERVER=192.168.1.10','/LOG=ci-logs\client.log') 'Только программа'

          if (Get-Service AvtoVes -ErrorAction SilentlyContinue) { Write-Output "::error::служба поставилась при «только программа»"; exit 1 }
          if (-not (Test-Path $exe)) { Write-Output "::error::нет АвтоВес.exe"; exit 1 }
          if (Test-Path "C:\Program Files\AvtoVes\python") { Write-Output "::error::поставился Python при «только программа»"; exit 1 }
          $url = (Get-ItemProperty HKLM:\Software\AvtoVes).Url
          Write-Output "адрес сервера: $url"
          if ($url -ne 'http://192.168.1.10:8780/') { Write-Output "::error::неверный адрес сервера $url"; exit 1 }
          $u = Start-Process "C:\Program Files\AvtoVes\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $u.WaitForExit(300000)) { Write-Output "::error title=Удаление::не завершилось за 5 минут"; exit 1 }
          Stop-Process -Id $busy.Id -Force -ErrorAction SilentlyContinue
          Write-Output "::notice title=Установщик::занятый порт, установка, проезд, программа, обновление, удаление, «только программа» — в порядке"

      - uses: actions/upload-artifact@v4
        with:
          name: AvtoVes-Setup-${{ inputs.version }}
          retention-days: 30
          path: dist/*

      # журналы установки и службы — в папку проекта (загрузка берёт файлы только оттуда)
      - name: Собрать журналы
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          Copy-Item C:\ProgramData\AvtoVes\logs\* ci-logs -ErrorAction SilentlyContinue
          Copy-Item C:\ProgramData\AvtoVes\data\avtoves.log ci-logs -ErrorAction SilentlyContinue
      # артефакты GitHub не всегда можно скачать — при сбое кладём журналы ещё и в релиз ci-debug
      - name: Диагностика при сбое
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path ci-logs\* -DestinationPath ci-debug.zip -Force
          gh release view ci-debug -R $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create ci-debug -R $env:GITHUB_REPOSITORY --prerelease --title "Диагностика сборки" --notes "Журналы последней неудачной сборки (служебное)." }
          gh release upload ci-debug ci-debug.zip -R $env:GITHUB_REPOSITORY --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: logs
          retention-days: 7
          path: ci-logs/

  release:
    needs: windows
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AvtoVes-Setup-${{ inputs.version }}
          path: dist
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$V" dist/* -R "$GITHUB_REPOSITORY" --title "АвтоВес $V" \
            --notes "Установщик для Windows 10/11 и Windows Server 2016+ (x64). Скачайте AvtoVes-Setup-$V.exe и запустите. При обновлении настройки и база сохраняются."
