# ============================================================
#  АвтоВес — настройки
#  Весы: «Магистраль-2» БВ2-С-80 (НПВ 80 000 кг, e = 20/50 кг)
#  Индикатор: CAS CI-200A, COM1 (RS-232) -> Moxa NPort
# ============================================================

# simulate: true — работа без железа (имитатор весов, реле и камер)
simulate: false

server:
  host: 0.0.0.0
  port: 8780
  # Токен для обмена с 1С (заголовок X-Api-Token). Поменяйте!
  api_token: "change-me-1c-token"

data_dir: data                 # БД, снимки, логи

# ---------- Весы ----------
scale:
  # Moxa NPort в режиме TCP Server:     tcp://192.168.1.50:4001
  # Moxa NPort в режиме Real COM (драйвер): serial://COM3?baud=9600
  connection: tcp://192.168.1.50:4001
  parser: cas                  # cas — формат CAS CI (ST,GS,...kg); generic — последнее число в строке
  data_len: 8                  # длина поля веса в посылке CAS
  timeout_sec: 3               # нет данных дольше — «нет связи»
  min_weight: 400              # кг, порог «машина на весах» (НмПВ)
  empty_weight: 200            # кг, ниже — платформа свободна
  stable_time: 3.0             # сек, сколько вес должен стоять
  stable_delta: 50             # кг, допустимый разброс за stable_time (≈ e)
  use_indicator_stable: true   # учитывать флаг ST индикатора

# ---------- Модуль ввода-вывода (светофоры, шлагбаумы, датчики) ----------
# Moxa ioLogik E1214 (6 DI + 6 реле), Modbus TCP
io:
  enabled: true
  host: 192.168.1.60
  port: 502
  unit_id: 1
  coil_base: 0                 # адрес первого реле (coil)
  di_base: 0                   # адрес первого дискретного входа
  # Номера реле (0..5). null — не используется
  relays:
    a_red: 0                   # светофор стороны А, красный
    a_green: 1                 # светофор стороны А, зелёный
    b_red: 2                   # светофор стороны Б, красный
    b_green: 3                 # светофор стороны Б, зелёный
    barrier_a: null            # шлагбаум А (импульс на открытие)
    barrier_b: null
  barrier_pulse_sec: 1.0
  # Номера входов (0..5). ИК-барьеры позиционирования на краях платформы.
  # Если барьер перекрыт — машина стоит не полностью, вес не фиксируется.
  inputs:
    ir_a: null
    ir_b: null
  ir_active_level: 1           # 1 — перекрыт при замкнутом входе, 0 — наоборот

# ---------- Логика проезда ----------
weighing:
  # through — въезд с одной стороны, выезд с другой (проездные весы)
  # reverse — въезд и выезд с одной стороны (тупиковые)
  mode: through
  auto_fix: true               # фиксировать вес автоматически после стабилизации
  clear_time: 3.0              # сек платформа пустая -> светофоры на въезд
  trip_max_hours: 24           # второе взвешивание ищется в пределах N часов
  plate_window_sec: 60         # номера, прочитанные за N сек до заезда, относятся к машине

# ---------- Камеры и распознавание ----------
anpr:
  engine: fast_alpr            # fast_alpr — локальное распознавание (ONNX, CPU)
  detector_model: yolo-v9-t-384-license-plate-end2end
  ocr_model: cct-xs-v1-global-model
  interval_ms: 300             # как часто распознавать кадр с каждой камеры
  min_confidence: 0.5
  country: ru                  # проверка формата номера РФ

cameras:
  - id: cam_a
    name: "Въезд А"
    side: a                    # с какой стороны платформы смотрит
    url: "rtsp://admin:password@192.168.1.71:554/Streaming/Channels/101"
    anpr: true
  - id: cam_b
    name: "Въезд Б"
    side: b
    url: "rtsp://admin:password@192.168.1.72:554/Streaming/Channels/101"
    anpr: true
  # Обзорная камера (без распознавания) — только снимок в журнал
  # - id: cam_top
  #   name: "Обзор платформы"
  #   side: null
  #   url: "rtsp://..."
  #   anpr: false
